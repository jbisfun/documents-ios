# Fossify Documents for iOS. Build with `idl build -c release` (see README.md).
toolchain:
  sdk_bundle: ~/.swiftpm/swift-sdks/darwin.artifactbundle
  swiftly_bin: ~/.local/share/swiftly/bin
  swiftc: swiftc
  ldid: ldid
  actool: idl-actool

targets:
  - name: FossifyDocuments
    bundle_id: org.fossify.documents.ios
    version: "1.2.2"
    build_number: "1"
    min_ios: "17.0"
    device_family: "1,2"
    link: [DocumentsKit, FossifyCommons]
    sources: [App]
    resources: [Resources/Assets.xcassets]
    frameworks: [SwiftUI, UIKit, Foundation, UniformTypeIdentifiers, PDFKit, WebKit]
    swift_version: "5.0"
    info:
      CFBundleDisplayName: Documents
      UIFileSharingEnabled: true
      LSSupportsOpeningDocumentsInPlace: true
      UIApplicationSceneManifest:
        UIApplicationSupportsMultipleScenes: false
      UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
      UISupportedInterfaceOrientations~ipad:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationPortraitUpsideDown
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
      CFBundleDocumentTypes:
        - CFBundleTypeName: PDF
          LSHandlerRank: Alternate
          LSItemContentTypes: [com.adobe.pdf]
        - CFBundleTypeName: Word document
          LSHandlerRank: Alternate
          LSItemContentTypes: [org.openxmlformats.wordprocessingml.document]
        - CFBundleTypeName: Markdown
          LSHandlerRank: Alternate
          LSItemContentTypes: [net.daringfireball.markdown]
        - CFBundleTypeName: CSV
          LSHandlerRank: Alternate
          LSItemContentTypes: [public.comma-separated-values-text, public.tab-separated-values-text]
        - CFBundleTypeName: HTML
          LSHandlerRank: Alternate
          LSItemContentTypes: [public.html, public.xhtml]
        - CFBundleTypeName: Text
          LSHandlerRank: Alternate
          LSItemContentTypes: [public.plain-text, public.text, public.json, public.xml, public.yaml]
    configurations:
      debug:
        entitlements:
          get-task-allow: true

  # Everything but the app entry point; also linked by the launcher (fossify-ios/launcher-ios).
  - name: DocumentsKit
    type: static
    min_ios: "17.0"
    link: [FossifyCommons]
    sources: [Sources]
    frameworks: [SwiftUI, UIKit, Foundation, UniformTypeIdentifiers, PDFKit, WebKit]
    swift_version: "5.0"

  # Shared core (fossify-ios/commons-ios), compiled into the app as a static Swift module.
  - name: FossifyCommons
    type: static
    dir: ../commons-ios
    min_ios: "17.0"
    sources: [Sources]
    frameworks: [SwiftUI, UIKit, Foundation]
    swift_version: "5.0"
